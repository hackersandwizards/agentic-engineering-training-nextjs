# https://lefthook.dev — Git hooks manager (Go binary, parallel by default).
# Staged-file filtering is built in via {staged_files}, so no lint-staged needed.

pre-commit:
  # Piped: run in order and stop on first failure. eslint --fix and
  # prettier --write touch the same files, so they must not run concurrently.
  piped: true
  commands:
    eslint:
      priority: 1
      glob: "*.{js,jsx,ts,tsx,mts}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      priority: 2
      glob: "*.{js,jsx,ts,tsx,mts,json,css,md}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
